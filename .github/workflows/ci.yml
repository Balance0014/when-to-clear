name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (synthetic transcripts)
        run: python -m unittest discover tests -v
      - name: The reminder runs the way Claude Code calls it
        run: |
          for i in 1 2; do
            echo '{"type":"assistant","timestamp":"2026-10-28T10:00:00Z","message":{"id":"m'$i'","usage":{"input_tokens":3,"cache_creation_input_tokens":2000,"cache_read_input_tokens":'$((150000 * i))',"output_tokens":500}}}'
          done > "$RUNNER_TEMP/t.jsonl"
          out=$(echo "{\"transcript_path\":\"$RUNNER_TEMP/t.jsonl\",\"session_id\":\"ci\"}" | WHEN_TO_CLEAR_STATE="$RUNNER_TEMP/n.json" python when_to_clear.py hook --at 200k)
          echo "$out"
          echo "$out" | python -c 'import json,sys; assert "302k" in json.load(sys.stdin)["systemMessage"]'
      - name: The report runs on an empty machine
        run: python when_to_clear.py --dir "$RUNNER_TEMP/none" | grep -q "No Claude Code usage"
      - name: Plugin files are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python -m json.tool "$f" > /dev/null && echo "ok $f"
          done

  skill-install:
    name: Install as an agent skill, the way the README says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npx skills add
        env:
          DO_NOT_TRACK: "1"
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          npx --yes skills@1.7.2 add "$url" --list
          npx --yes skills@1.7.2 add "$url" --agent claude-code --yes
          find -L . -path '*handoff/SKILL.md' | grep .
